# =============================================================================
#  HX5 5-zone heater expansion board - Klipper config include
#  Add to printer.cfg with:   [include hx5.cfg]
#
#  Pin map (STM32G0B1):
#    Heaters   HE0..HE4  = PB10 PB11 PB12 PB13 PB14
#    Sensors   TH0..TH4  = PA0  PA1  PA2  PA3  PA4
#    Board NTC           = PA5      VIN sense (/11) = PA6
#    Fan0 = PB9   Fan1 = PA7   Interlock sense = PB2   Status LED = PA15
# =============================================================================

[mcu hx5]
# --- USB: uncomment and fill in ---
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_CHANGE_ME-if00
# --- CAN: comment out 'serial' above and use this instead ---
#canbus_uuid: CHANGE_ME
restart_method: command

# -----------------------------------------------------------------------------
#  Heater zones
#  - sensor_type: change to your sensor (Generic 3950, ATC Semitec 104GT-2,
#    NTC 100K MGB18-104F39050L32, PT1000 ...).
#  - For a PT1000, fit the PT1000 jumper of that channel and set
#    pullup_resistor: 1000
#  - max_power: lower it if your PSU cannot supply 5 x 120 W at the same time.
#    (e.g. 750 W PSU with 100 W of other loads -> leave at 1.0;
#          450 W PSU -> 0.6 on every zone)
#  - The PID values are placeholders - run PID_CALIBRATE for every zone.
# -----------------------------------------------------------------------------

[heater_generic hx5_zone0]
heater_pin: hx5:PB10
sensor_type: Generic 3950
sensor_pin: hx5:PA0
pullup_resistor: 4700
control: pid
pid_Kp: 40.0
pid_Ki: 1.0
pid_Kd: 300.0
pwm_cycle_time: 0.100
max_power: 1.0
min_temp: 0
max_temp: 120

[heater_generic hx5_zone1]
heater_pin: hx5:PB11
sensor_type: Generic 3950
sensor_pin: hx5:PA1
pullup_resistor: 4700
control: pid
pid_Kp: 40.0
pid_Ki: 1.0
pid_Kd: 300.0
pwm_cycle_time: 0.100
max_power: 1.0
min_temp: 0
max_temp: 120

[heater_generic hx5_zone2]
heater_pin: hx5:PB12
sensor_type: Generic 3950
sensor_pin: hx5:PA2
pullup_resistor: 4700
control: pid
pid_Kp: 40.0
pid_Ki: 1.0
pid_Kd: 300.0
pwm_cycle_time: 0.100
max_power: 1.0
min_temp: 0
max_temp: 120

[heater_generic hx5_zone3]
heater_pin: hx5:PB13
sensor_type: Generic 3950
sensor_pin: hx5:PA3
pullup_resistor: 4700
control: pid
pid_Kp: 40.0
pid_Ki: 1.0
pid_Kd: 300.0
pwm_cycle_time: 0.100
max_power: 1.0
min_temp: 0
max_temp: 120

[heater_generic hx5_zone4]
heater_pin: hx5:PB14
sensor_type: Generic 3950
sensor_pin: hx5:PA4
pullup_resistor: 4700
control: pid
pid_Kp: 40.0
pid_Ki: 1.0
pid_Kd: 300.0
pwm_cycle_time: 0.100
max_power: 1.0
min_temp: 0
max_temp: 120

# -----------------------------------------------------------------------------
#  Thermal-runaway protection (one per zone).
#  These defaults suit small, fast heaters (silicone pads, cartridges).
#  For a large thermal mass such as a chamber heater, raise check_gain_time
#  (e.g. 300) and lower heating_gain (e.g. 1) - but never remove these sections.
# -----------------------------------------------------------------------------

[verify_heater hx5_zone0]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater hx5_zone1]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater hx5_zone2]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater hx5_zone3]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater hx5_zone4]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

# -----------------------------------------------------------------------------
#  Board health monitoring
# -----------------------------------------------------------------------------

# On-board NTC (Murata NCP18WF104F03RC, 100k, B=4250) sits among the heater FETs.
[thermistor hx5_ncp18_100k]
temperature1: 25
resistance1: 100000
beta: 4250

# Board fan on FAN0 is driven from the board NTC. If the FET area passes
# max_temp, Klipper shuts down, which switches every heater off.
[temperature_fan hx5_board]
pin: hx5:PB9
sensor_type: hx5_ncp18_100k
sensor_pin: hx5:PA5
pullup_resistor: 4700
control: watermark
target_temp: 45
max_delta: 3
min_temp: -20
max_temp: 85
max_speed: 1.0
min_speed: 0.0
shutdown_speed: 1.0

[temperature_sensor hx5_mcu]
sensor_type: temperature_mcu
sensor_mcu: hx5
max_temp: 100

# VIN monitor: displayed as a "temperature" that equals volts.
# PA6 sees VIN / 11, so 3.3 V at the ADC = 36.3 V. Klipper shuts down above
# max_temp, i.e. if VIN goes over 30 V.
[adc_temperature hx5_vin_divider]
temperature1: 0
voltage1: 0
temperature2: 36.3
voltage2: 3.3

[temperature_sensor hx5_vin]
sensor_type: hx5_vin_divider
sensor_pin: hx5:PA6
adc_voltage: 3.3
min_temp: -5
max_temp: 30

# -----------------------------------------------------------------------------
#  Auxiliary fan (FAN1) - general purpose
# -----------------------------------------------------------------------------
[fan_generic hx5_fan1]
pin: hx5:PA7
max_power: 1.0
shutdown_speed: 0

# -----------------------------------------------------------------------------
#  Hardware interlock: PB2 is high while the J5 loop is closed. The gate drivers
#  are already disabled in hardware the moment the loop opens. This only makes
#  Klipper stop too, so the failure is visible and the heaters do not restart
#  when the loop is closed again.
# -----------------------------------------------------------------------------
[gcode_button hx5_interlock]
pin: !hx5:PB2
press_gcode:
    {action_emergency_stop("HX5 heater interlock opened")}

# -----------------------------------------------------------------------------
#  Convenience macros
# -----------------------------------------------------------------------------
[gcode_macro HX5_ALL_OFF]
description: Turn off all five HX5 heater zones
gcode:
    {% for z in range(5) %}
      SET_HEATER_TEMPERATURE HEATER=hx5_zone{z} TARGET=0
    {% endfor %}

[gcode_macro HX5_SET_ALL]
description: Set all five HX5 zones to the same target. Usage: HX5_SET_ALL TARGET=60
gcode:
    {% set t = params.TARGET|default(0)|float %}
    {% for z in range(5) %}
      SET_HEATER_TEMPERATURE HEATER=hx5_zone{z} TARGET={t}
    {% endfor %}

# Status LED (PA15). Katapult also blinks it while in the bootloader.
[output_pin hx5_status_led]
pin: hx5:PA15
value: 1
